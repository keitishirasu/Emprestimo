name: Avisos do empréstimo
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
permissions:
  contents: write
  issues: write
concurrency: avisos
jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verificar movimentações
        env:
          PIN: ${{ secrets.EMP_PIN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          [ -n "${PIN}" ] || { echo "Segredo EMP_PIN não cadastrado"; exit 1; }
          curl -sf -X POST "https://xcztxsmnwlmihlvlbflr.supabase.co/rest/v1/rpc/emp_historico" \
            -H "apikey: sb_publishable_qpZzR6p2_zoDywjPrF9kPQ_idw5XAir" -H "Content-Type: application/json" \
            -d "$(jq -n --arg p "$PIN" '{p:$p}')" > hist.json
          ULT=$(cat ultimo.txt 2>/dev/null || echo "1970-01-01T00:00:00Z")
          N=$(jq --arg u "$ULT" '[.[] | select(.quando > $u)] | length' hist.json)
          [ "$N" -gt 0 ] || { echo "Nada novo"; exit 0; }
          gh issue create --assignee keitishirasu \
            --title "Empréstimo: ${N} nova(s) movimentação(ões)" \
            --body "Houve ${N} movimentação(ões) no app do empréstimo. Abra https://keitishirasu.github.io/Emprestimo/ e veja o Histórico."
          jq -r 'max_by(.quando).quando' hist.json > ultimo.txt
          git config user.name "avisos-emprestimo"
          git config user.email "actions@users.noreply.github.com"
          git add ultimo.txt && git commit -m "Marcador de avisos" && git push
